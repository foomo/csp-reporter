name: Test Branch

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/actions/setup-go/releases
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

      - run: go build ./...
        working-directory: example/server

      # https://hub.docker.com/r/prom/prometheus/tags
      - name: Check the example alert rules
        env:
          PROMETHEUS_IMAGE: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
        run: |
          docker run --rm -v "$PWD/alerts:/alerts:ro" -w /alerts --entrypoint promtool "$PROMETHEUS_IMAGE" check rules csp-reporter.rules.yaml
          docker run --rm -v "$PWD/alerts:/alerts:ro" -w /alerts --entrypoint promtool "$PROMETHEUS_IMAGE" test rules csp-reporter.rules_test.yaml
