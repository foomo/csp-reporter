name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please fill out the information below to help us understand and resolve the problem.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported
          required: true
        - label: I have checked the README
          required: true
        - label: I am using the latest version
          required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: Which release or Docker image tag are you running?
      placeholder: e.g., 1.3.0 or foomo/csp-reporter:1.3.0
    validations:
      required: true

  - type: textarea
    id: deployment
    attributes:
      label: Deployment
      description: How is the reporter deployed and exposed?
      placeholder: e.g., Helm chart, plain Docker, binary; ingress or proxy in front; flags passed
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: The browser and report format involved, and the request that was sent
      placeholder: |
        1. Browser and version (e.g., Chrome 130)
        2. Report format (legacy report-uri "csp-report" or Reporting API report-to)
        3. Request sent (method, Content-Type, body), e.g., as a curl command
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: e.g., 204 response, one log line, metric incremented
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Response status, the relevant log line, or the foomo_csr_violated_directive_total series
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, environment, configuration, or information about the problem
      placeholder: Add any other relevant details here
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: If you have suggestions on how to fix this, please share
      placeholder: Optional - your ideas for fixing this issue
    validations:
      required: false
