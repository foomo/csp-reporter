# promtool test rules csp-reporter.rules_test.yaml
rule_files:
  - csp-reporter.rules.yaml

evaluation_interval: 1m

tests:
  # With history: prod goes from 6 to 60 enforced reports a minute; stage stays at 60, three times nothing.
  - interval: 1m
    input_series:
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="prod",directive="img-src",disposition="enforce"}'
        values: '0+6x1440 8640+60x60'
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="stage",directive="img-src",disposition="enforce"}'
        values: '0+60x1500'
    alert_rule_test:
      - eval_time: 1d1h
        alertname: CSPEnforcedViolationSpike
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: prod
            exp_annotations:
              summary: Enforced CSP violations of site prod spiked

  # Without history: neither site existed a day earlier, so only the absolute floor counts.
  - interval: 1m
    input_series:
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="prod",directive="img-src",disposition="enforce"}'
        values: '_x1440 0+60x60'
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="stage",directive="img-src",disposition="enforce"}'
        values: '_x1440 0+1x60'
    alert_rule_test:
      - eval_time: 1d1h
        alertname: CSPEnforcedViolationSpike
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: prod
            exp_annotations:
              summary: Enforced CSP violations of site prod spiked

  # Quiet sites: prod reports until 1h, then only the selected prod alerts, 6 hours after its last report.
  - interval: 1m
    input_series:
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="prod",directive="img-src",disposition="enforce"}'
        values: '0+1x60 60x480'
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="stage",directive="img-src",disposition="enforce"}'
        values: '0x540'
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="other",directive="img-src",disposition="enforce"}'
        values: '0x540'
    alert_rule_test:
      - eval_time: 6h50m
        alertname: CSPSiteSilent
        exp_alerts: []
      - eval_time: 7h10m
        alertname: CSPSiteSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: prod
            exp_annotations:
              summary: No CSP reports for site prod for 6 hours

  # Unknown directives: steady ones on prod alert after the hold; a single one on other never does.
  - interval: 1m
    input_series:
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="prod",directive="unknown",disposition="enforce"}'
        values: '0+1x120'
      - series: 'foomo_csr_site_violations_total{job="csp-reporter",instance="a",site="other",directive="unknown",disposition="enforce"}'
        values: '0x30 1x90'
    alert_rule_test:
      - eval_time: 20m
        alertname: CSPUnknownDirective
        exp_alerts: []
      - eval_time: 1h
        alertname: CSPUnknownDirective
        exp_alerts:
          - exp_labels:
              severity: ticket
              site: prod
            exp_annotations:
              summary: CSP reports of site prod with an unknown directive

  - interval: 1m
    input_series:
      - series: 'foomo_csr_requests_rejected_total{job="csp-reporter",instance="a",reason="overloaded"}'
        values: '0x10 5x10'
      - series: 'foomo_csr_requests_rejected_total{job="csp-reporter",instance="a",reason="rate_limited"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CSPReporterOverloaded
        exp_alerts: []
      - eval_time: 15m
        alertname: CSPReporterOverloaded
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: csp-reporter
            exp_annotations:
              summary: csp-reporter answered large uploads with 503
      - eval_time: 15m
        alertname: CSPReporterRateLimited
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'up{job="csp-reporter",instance="a"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: CSPReporterDown
        exp_alerts:
          - exp_labels:
              severity: page
              job: csp-reporter
            exp_annotations:
              summary: No csp-reporter metrics for 5 minutes
